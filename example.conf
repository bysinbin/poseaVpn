# PoseaVPN Örnek Konfigürasyon Dosyası
# Hem standart WireGuard sunucuları ile hem de TCP/WebSocket Fallback ağ geçitleri ile uyumludur.

[Interface]
# İstemcinin özel anahtarı (Curve25519)
PrivateKey = aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa=

# İstemcinin VPN IP adresi
Address = 10.10.0.5/24

# Active Directory Domain Controller DNS IP adresi ve etki alanı suffix'i
# PoseaVPN bu suffix'i Windows NRPT tablosuna işleyerek AD SRV/RPC kayıtlarının doğru çözülmesini sağlar.
DNS = 10.10.0.1, sirket.local

# İsteğe bağlı MTU (Varsayılan 1420)
MTU = 1420

# İsteğe bağlı İletim Türü: "udp" (varsayılan), "wss" (WebSocket/HTTPS proxy) veya "auto"
# Transport = auto
# FallbackURL = wss://vpn.sirket.com:8443/wg

[Peer]
# Sunucunun ortak anahtarı (Public Key)
PublicKey = bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb=

# WireGuard sunucu uç noktası (Standart UDP)
Endpoint = vpn.sirket.com:51820

# Şirket içi yönlendirilecek IP blokları (Split-tunneling)
# AD ortamlarında 0.0.0.0/0 yerine iç ağ bloklarını yazmak önerilir:
AllowedIPs = 10.10.0.0/16, 192.168.1.0/24

# NAT arkasındaki bağlantıyı canlı tutma aralığı (saniye)
PersistentKeepalive = 25
